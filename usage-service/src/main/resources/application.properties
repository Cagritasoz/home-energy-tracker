spring.application.name=usage-service

server.port=8083

# InfluxDB has no username/password - INFLUXDB3_AUTH_TOKEN must be set as an actual env var (create it
# once with: docker exec -it influxdb influxdb3 create token --admin), same pattern as
# ${POSTGRES_USER}/${POSTGRES_PASSWORD} elsewhere in this repo, just no default to fall back on.
app.influxdb.host=http://localhost:8181
app.influxdb.token=${INFLUXDB3_AUTH_TOKEN}
app.influxdb.database=energy_usage

spring.kafka.bootstrap-servers=localhost:9094

app.kafka.topic.energy-usage=energy-usage-events
spring.kafka.consumer.group-id=usage-service

# How it works: no explicit spring.kafka.listener.ack-mode set here, so it's the default BATCH -
# offsets commit only after the whole poll batch finishes (success or handed to the recoverer),
# not per record. A record still mid-retry has no committed offset yet, so a crash there means
# it gets re-fetched and reprocessed from scratch on restart - observed directly while testing
# the DLQ path, where a stuck poison message was reprocessed after a restart rather than skipped.

# Retries before giving up and routing a failing record to energy-usage-events-dlt (see
# KafkaErrorHandlingConfig) - covers both a Kafka-level poison message and a transient InfluxDB
# write failure thrown out of the listener.
app.kafka.retry.max-attempts=2
app.kafka.retry.interval-ms=1000

# ErrorHandlingDeserializer wraps the real (delegate) deserializers below so a deserialization
# failure (bad JSON, unmapped __TypeId__ alias) is caught and deferred to the listener
# container's error handler instead of wedging the consumer forever on a poison record it can
# never get past.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.LongDeserializer

# JacksonJsonDeserializer, not the older JsonDeserializer - JsonDeserializer is Spring Kafka's
# legacy, Jackson-2-based deserializer (com.fasterxml.jackson.databind), and this project has no
# Jackson 2 databind on its classpath, only Jackson 3's tools.jackson.databind. Matches
# ingestion-service's producer-side JacksonJsonSerializer.
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer


# Consumer side of the same alias contract as ingestion-service's producer-side
# spring.json.type.mapping: the producer writes the logical alias "energy-usage-event" into the
# __TypeId__ header instead of its own class name, and this maps that SAME alias to
# usage-service's OWN independently-defined EnergyUsageEvent class below - usage-service never
# needs to depend on ingestion-service's package for this to work.
spring.kafka.consumer.properties.spring.json.type.mapping=energy-usage-event:com.cagritasoz.usage_service.event.EnergyUsageEvent

# JacksonJsonDeserializer refuses to instantiate types outside this list by default (a
# deserialization-time safety check) - has to include the package the mapped class above lives in.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cagritasoz.usage_service.event

# device-service, for the device-id cache poller - same timeout reasoning as
# user-service.connect-timeout-ms/read-timeout-ms in device-service.
device-service.base-url=http://localhost:8081
device-service.connect-timeout-ms=3000
device-service.read-timeout-ms=5000
device-service.device-id-cache.refresh-interval-ms=30000
