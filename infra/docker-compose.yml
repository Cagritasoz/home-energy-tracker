# Compose project name
name: home-energy-tracker

services:

  # user-service's own Postgres instance. NOT shared, in name or intent - device-service/
  # ingestion-service/usage-service still point their POSTGRES_DB/USER/PASSWORD-shaped local env
  # at this same physical instance for now, because they haven't been rebuilt with their own DB
  # yet; that's temporary and known, not this rename's problem to fix. When each of those services
  # gets rebuilt, it gets its own instance the same way this one and keycloak-db did.
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    ports:
      - "5432:5432"
    environment:
      # Only the password is a secret - the db name and username are structural config, not
      # credentials, so they're hardcoded here rather than routed through .env like POSTGRES_PASSWORD.
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      # Runs once on first init (empty volume only). Creates the app database.
      # Skipped on all subsequent startups — Flyway owns schema from here.
      # - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql is redundant commenting it out.
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_service -d user_service" ] # Asks Postgres if it's ready to accept connections
      interval: 10s    # Run the check every 10 seconds
      timeout: 5s      # If no response within 5 seconds, count it as failed
      retries: 5       # # Mark the container as unhealthy after 5 consecutive failures

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    ports:
      - "5433:5432"
    environment:
      # Only the password is a secret - see the same note on user-db above.
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    # Not started by a plain `up`: only usage-service needs it. `--profile influxdb` adds it.
    profiles: [ "influxdb" ]
    ports:
      - "8181:8181"                               # HTTP API - query/write/admin, all on one port
    command:
      - influxdb3
      - serve
      - --node-id=node0                           # id of this server instance (multi-node clusters only - unrelated to where data lives)
      - --object-store=file                       # local disk, same as postgres/kafka elsewhere in this file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      # Mounted at the parent dir, not .../data: the image pre-owns /var/lib/influxdb3 for its
      # non-root user, so the volume inherits write access here. Mounting .../data directly
      # gets a root-owned volume instead, and the server fails to start ("Permission denied").
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      # /health itself requires a token by default (401 without one) - this only confirms the
      # HTTP server is answering at all (2xx or 4xx), not that a token has been created yet.
      test: [ "CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8181/health | grep -qE '^[24]'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-broker-controller-1:
    image: apache/kafka:4.3.1
    container_name: kafka-broker-controller-1
    # Not started by a plain `up`; `--profile kafka` starts the broker and kafka-ui together.
    profiles: [ "kafka" ]
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_CLUSTER_ID: 'energy-tracker-cluster-1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-controller-1:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-broker-controller-1:9092,
        EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # Queries the INTERNAL listener (localhost:9092 from inside this container) for its
      # supported API versions - confirms the broker is actually accepting client protocol
      # connections, not just that the TCP port is open. start_period 30s: KRaft's own metadata
      # quorum + log dir init can take a while on a fresh container, longer than the usual
      # Postgres/InfluxDB startup this file's other healthchecks are tuned for.
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s # For the first 30 seconds after container starts, don't treat failed healthchecks as evidence that the container is unhealthy.

  # One-shot: creates every Kafka topic this project needs (currently just user.events.v1, see
  # kafka/kafka-topics.sh) and then exits 0. Seeing it as "Exited (0)" in `docker compose ps` is
  # expected, not a crash - it isn't meant to keep running like the other services here.
  #
  # Same image as the broker itself, so no extra image is pulled just for this. Its default
  # entrypoint (/__cacert_entrypoint.sh) only does optional CA-cert setup we don't use here and
  # then `exec`s whatever command it's given, so overriding just `command` (not `entrypoint`) is
  # enough to run our script instead of starting a broker.
  kafka-topics-init:
    image: apache/kafka:4.3.1
    container_name: kafka-topics-init
    profiles: [ "kafka" ]
    depends_on:
      kafka-broker-controller-1:
        condition: service_healthy # Topics can't be created before the broker is actually accepting connections.
    volumes:
      - ./kafka/kafka-topics.sh:/scripts/kafka-topics.sh:ro
    command: [ "sh", "/scripts/kafka-topics.sh" ]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    profiles: [ "kafka" ]
    ports:
      - "8070:8080"
    depends_on:
      kafka-broker-controller-1:
        condition: service_healthy # Wait for the broker to actually accept connections, not just start.
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Containers on this compose file's default network reach each other by service name,
      # not localhost - "localhost" inside kafka-ui's own container means kafka-ui itself, not
      # the host machine or any sibling container, so this has to be the broker's service name.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-controller-1:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    ports:
      - "8080:8080" # Main HTTP (Keycloak's default port).
      - "9000:9000" # Management. Convenient in dev; NEVER exposed publicly.
    depends_on:
      keycloak-db:
        condition: service_healthy # Wait for the DB to accept connections.
    command:
      # DEV ONLY. Permits HTTP, relaxes hostname checks, local cache,
      # rebuilds config each boot. Production: `start --optimized`.
      - start-dev
      # Imports any realm JSON in /opt/keycloak/data/import at startup.
      # CRITICAL: only creates realms that DON'T EXIST. After editing the
      # realm file `docker compose down -v` to see the effect, not `restart`.
      - --import-realm
    environment:
      # ── Bootstrap admin (master realm) ──
      # KC_BOOTSTRAP_* replaces the deprecated KEYCLOAK_ADMIN* names as of KC 26.
      # Creates the first admin on an EMPTY database only. Production: use once,
      # create a real admin, then remove these.
      # Only the password is a secret - admin username is no more sensitive than any other username.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # keycloak-db's own db name/username, hardcoded here to match keycloak-db's hardcoded values
      # above - only its password stays env-sourced, same role on both ends of this connection.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # ── Networking / issuer identity ──
      KC_HTTP_ENABLED: "true"    # DEV ONLY — plain HTTP. Production: HTTPS only.

      # Pins the advertised base URL: the `iss` claim in every token and the
      # `issuer` in the discovery document. Without this, Keycloak infers it
      # from the Host header, and the issuer would differ depending on which
      # address the caller used (401s). This only fixes what Keycloak ADVERTISES;
      # it does not change where it can be reached. From the host that is
      # localhost:8080; from another container on this compose network it is
      # http://keycloak:8080, and tokens still carry the localhost issuer.
      #
      # Production: KC_HOSTNAME: https://auth.example.com
      KC_HOSTNAME: http://localhost:8080

      # ── Observability ──
      # Exposes /health, /health/ready, /health/live on the MANAGEMENT port
      # (9000) — NOT the main HTTP port. This moved in Keycloak 25.
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: "true"   # Prometheus endpoint on 9000.
      KC_LOG_LEVEL: info           # `debug` is preferred when diagnosing token problems.

      # ── Mail ──
      # The realm's SMTP server (realm-energy.json) is mailpit:1025 below; nothing to set here for that.
      # The realm enables Keycloak's built-in "email" event listener to send "your password was changed" notices.
      # That listener ignores the realm's own event-type list and, left alone, also mails the account owner on
      # EVERY failed login ("Login error": anyone could mail-bomb a victim with wrong passwords) and sends a second
      # "Update credential" mail per password change. This server-level option restricts it to password changes.
      KC_SPI_EVENTS_LISTENER__EMAIL__INCLUDE_EVENTS: UPDATE_PASSWORD

      # ── Secrets referenced by the realm import ──
      # realm-energy.json contains the literal text ${USER_SERVICE_ADMIN_CLIENT_SECRET}; Keycloak replaces it with
      # this environment variable while importing (an unset variable leaves the placeholder text in place, which
      # would make the client secret that literal string). user-service reads the same variable when it calls
      # Keycloak's admin API. Value: infra/.env (see .env.example).
      USER_SERVICE_ADMIN_CLIENT_SECRET: ${USER_SERVICE_ADMIN_CLIENT_SECRET}
    volumes:
      # host-path:container-path:mode - :ro mounts it read-only, container can't modify your file.
      - ./keycloak/realm-energy.json:/opt/keycloak/data/import/realm-energy.json:ro
    healthcheck:
      # No curl/wget in the Keycloak image - open a raw TCP connection to the health endpoint via
      # bash's /dev/tcp instead (the same trick as an actual HTTP client, just without one installed).
      # Port 9000, not 8080: health endpoints live on the separate MANAGEMENT port (KC_HEALTH_ENABLED
      # above), never the main HTTP port.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # Catches every mail the stack sends instead of delivering it: Keycloak's registration verification, password
  # reset and password-changed mails today, notification-service's later. Open http://localhost:8025 to read them.
  # No login, no TLS, no volume: messages live in memory and are gone after a restart, which is what a dev
  # mailbox should do. Keycloak reaches it as mailpit:1025 on this compose network (the realm's SMTP host).
  # Not a dependency of keycloak on purpose: Keycloak only talks to it when it sends a mail.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "8025:8025" # Web UI and REST API.
      - "1025:1025" # SMTP.
    healthcheck:
      # The binary has a built-in readiness check (the image has no curl/wget): exit code 0 = ready.
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Without name: a volume defaults to <project>_<key> (project = top-level name: above).
  # With name: it's pinned to that exact string instead, regardless of the project name.
  # Volumes are explicitly named so they are not effected by project name changes.
  keycloak_db_data:
    name: home-energy-tracker_keycloak_db_data
  # Docker has no "rename a volume" operation; if a volume name is to be changed volume has to be removed.
  user_db_data:
    name: home-energy-tracker_user_db_data
  kafka_data:
    name: home-energy-tracker_kafka_data
  influxdb_data:
    name: home-energy-tracker_influxdb_data

