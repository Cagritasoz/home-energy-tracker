name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    # Testcontainers needs a real Docker daemon - GitHub's Ubuntu runners already have one running,
    # no extra setup step required. Every *IT class starts its own containers through it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2/repository between runs, keyed on the pom.xml files - avoids
          # re-downloading every dependency on every push.
          cache: 'maven'

      # Runs against the whole reactor from the root pom, matching how the project is built locally.
      # -Pe2e is never activated here, so the Testcontainers-ComposeContainer stub in e2e/ is skipped.
      #
      # "verify" runs both test plugins in order: Surefire runs the *Test classes (unit tests, no Docker)
      # in the "test" phase, then Failsafe runs the *IT classes (Testcontainers) in "integration-test",
      # after "package". A failing unit test stops the build before any container starts; Failsafe
      # reports its failures in "verify", after the containers are gone.
      #
      # -Dtest only filters Surefire (Failsafe's own filter is -Dit.test). It excludes every
      # *ApplicationTests class: a full @SpringBootTest (contextLoads) that boots the real app and needs
      # a live Postgres and a reachable Keycloak issuer, which this job does not provide.
      # -Dtest REPLACES Surefire's default name patterns, so they are listed again: an exclusion alone
      # ("!**/*ApplicationTests") would mean "every class but those" and Surefire would run the *IT
      # classes too (seen: every integration test ran twice).
      - name: Unit and integration tests
        run: >
          ./mvnw --batch-mode --no-transfer-progress verify
          -Dtest='**/*Test,**/*Tests,!**/*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
