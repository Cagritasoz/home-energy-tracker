spring.application.name=device-service

server.port=8081

# force English regardless of client Accept-Language / OS locale (validation messages were resolving to Turkish otherwise)
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# TODO: switch to the Docker Compose service name (not localhost) once device-service is containerized
user-service.base-url=http://localhost:8080

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}?currentSchema=device_service
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# same physical Postgres instance/database as user-service, but its own schema so each
# service gets its own flyway_schema_history and neither sees the other's migrations
spring.flyway.schemas=device_service

# validate because we are using flyway
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
