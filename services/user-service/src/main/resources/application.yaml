spring:
  application:
    name: user-service

  web:
    # force English regardless of client Accept-Language / OS locale (validation messages were resolving to Turkish otherwise)
    locale: en_US
    locale-resolver: fixed

  # Only the password is a secret - db name and username are structural config, not credentials,
  # so they're hardcoded here to match user-db's own hardcoded values (infra/docker-compose.yml)
  # instead of routed through an env var the way host/port were already hardcoded below even before this.
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service
    username: user_service
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # No currentSchema / spring.flyway.schemas here on purpose, unlike the old shared-instance setup -
  # user-db (infra/docker-compose.yml) is now a dedicated Postgres instance for this service alone,
  # so there's no other service's tables to namespace away from inside it. Flyway and Hibernate both
  # fall back to Postgres' default search_path, which resolves to the "public" schema for a normal
  # user - V1-V5 run against it exactly the same as they did against the old named schema, since none
  # of them reference the schema name itself.

  jpa:
    # validate because we are using flyway
    hibernate:
      ddl-auto: validate

  task:
    scheduling:
      pool:
        size: 4

  kafka:
    bootstrap-servers: localhost:9094
    producer:
       key-serializer: org.apache.kafka.common.serialization.StringSerializer
       value-serializer: org.apache.kafka.common.serialization.StringSerializer
       client-id: user-service-outbox-relay
       compression-type: none

       # --- durability ---
       acks: all
       retries: 2147483647
       buffer-memory: 32MB
       batch-size: 16KB

       properties:
         enable.idempotence: true
         max.in.flight.requests.per.connection: 5
         linger.ms: 5
         max.request.size: 1048576

         # --- time limits (the part that drives the relay's failure behavior) ---
         max.block.ms: 1500
         delivery.timeout.ms: 5000
         request.timeout.ms: 3000

         # --- reconnects and retries: the producer's own backoff, which is why the relay needs none against Kafka ---
         retry.backoff.ms: 100
         retry.backoff.max.ms: 1000
         reconnect.backoff.ms: 50
         reconnect.backoff.max.ms: 1000
         connections.max.idle.ms: 540000
         metadata.max.age.ms: 300000
         metadata.max.idle.ms: 300000

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak resource-server config. issuer-uri is only the value the token's "iss" claim must equal
          # (Keycloak's KC_HOSTNAME is pinned to the same string); it is compared, never fetched. jwk-set-uri is
          # where the signing keys are fetched, on the first token and then cached; because it is given
          # explicitly, startup makes no call to Keycloak. Inside a container, override only jwk-set-uri
          # (http://keycloak:8080/...); issuer-uri stays as it is.
          issuer-uri: http://localhost:8080/realms/energy-tracker
          jwk-set-uri: http://localhost:8080/realms/energy-tracker/protocol/openid-connect/certs

server:
  port: 8081

# Only "health" is exposed over HTTP, spelled out explicitly rather than relying on Spring Boot's
# own default staying what it is - /env, /beans etc. can leak configuration and must never be
# public. DataSource (Postgres) health is wired in automatically because spring-boot-starter-data-jpa
# and the postgresql driver are already on the classpath - no extra code needed for that part.
management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # outbox.relay.*: how often OutboxRelay polls outbox_events for unpublished rows, and how many
  # it takes per tick - a bounded batch so a large backlog (e.g. after downtime) is drained
  # gradually across several ticks instead of one long-running poll.
  outbox:
     relay:
       interval-ms: 2000
       batch-size: 50
       # One deadline for all acks of a batch (the relay holds the advisory lock and a DB connection meanwhile).
       send-timeout-ms: 5000
       max-batches-per-tick: 10
       # What the relay does after a tick that published nothing (Kafka down, a poison row at the head of the
       # queue): it skips ticks for initial-ms, then 2x that after the next failure, and so on up to max-ms,
       # and goes back to every interval-ms as soon as a tick publishes something. Only the relay's own
       # resources are at stake (a DB connection and the advisory lock for up to send-timeout-ms per failed tick,
       # an UPDATE of attempts/last_error, a WARN line) - Kafka already gets its backoff from the producer
       # settings above. A longer wait only delays events that cannot be sent anyway; max-ms bounds the delay
       # after Kafka is back.
       backoff:
         initial-ms: 4000
         max-ms: 30000
     purge:
       retention-days: 7
       batch-size: 1000
       cron: "0 0 3 * * *"

  security:
    # Required for audience mapper
    required-audience: user-service
