
spring:
  application:
    name: user-service

  web:
    # force English regardless of client Accept-Language / OS locale (validation messages were resolving to Turkish otherwise)
    locale: en_US
    locale-resolver: fixed

  # Only the password is a secret - db name and username are structural config, not credentials,
  # so they're hardcoded here to match user-db's own hardcoded values (infra/docker-compose.yml)
  # instead of routed through an env var the way host/port were already hardcoded below even before this.
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service
    username: user_service
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # No currentSchema / spring.flyway.schemas here on purpose, unlike the old shared-instance setup -
  # user-db (infra/docker-compose.yml) is now a dedicated Postgres instance for this service alone,
  # so there's no other service's tables to namespace away from inside it. Flyway and Hibernate both
  # fall back to Postgres' default search_path, which resolves to the "public" schema for a normal
  # user - V1-V5 run against it exactly the same as they did against the old named schema, since none
  # of them reference the schema name itself.

  jpa:
    # validate because we are using flyway
    hibernate:
      ddl-auto: validate

  task:
    scheduling:
      # One thread per scheduled job that can be busy at the same time: the relay, the promoter, the Keycloak delete job
      # and the finalizer, plus the two daily purges (outbox, processed events), which are short and rarely overlap. A
      # fixedDelay job never overlaps itself, but a slow tick of one (a relay tick against a dead Kafka, a Keycloak call
      # that times out) must not delay the others.
      pool:
        size: 6

  kafka:
    bootstrap-servers: localhost:9094

    # What both producers of the service share: the outbox relay's (relayKafkaTemplate, the one OutboxBatchPublisher gets)
    # and the dead-letter publisher's (deadLetterKafkaTemplate). Both are declared in KafkaProducerConfig, each with its
    # own client id from app.kafka.* below. Setting client-id here is wrong: the config overwrites it, so it would be ignored.
    producer:
       key-serializer: org.apache.kafka.common.serialization.StringSerializer
       value-serializer: org.apache.kafka.common.serialization.StringSerializer
       compression-type: none

       # --- durability ---
       acks: all
       retries: 2147483647
       buffer-memory: 32MB
       batch-size: 16KB

       properties:
         enable.idempotence: true
         max.in.flight.requests.per.connection: 5
         linger.ms: 5
         max.request.size: 1048576

         # --- time limits (the part that drives the relay's failure behavior) ---
         max.block.ms: 1500
         delivery.timeout.ms: 5000
         request.timeout.ms: 3000

         # --- reconnects and retries: the producer's own backoff, which is why the relay needs none against Kafka ---
         retry.backoff.ms: 100
         retry.backoff.max.ms: 1000
         reconnect.backoff.ms: 50
         reconnect.backoff.max.ms: 1000
         connections.max.idle.ms: 540000
         metadata.max.age.ms: 300000
         metadata.max.idle.ms: 300000

    # The consumer side: the participants' confirmations of a deletion (ParticipantAckListener). Values are read as plain
    # strings and parsed by the listener, so a malformed message is an ordinary exception there (and goes to the
    # dead-letter topic) instead of a deserialization failure nothing can republish.
    consumer:
      group-id: user-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The container acknowledges each record itself, after the listener has committed its transaction (ack-mode below);
      # automatic commits would acknowledge records the listener has not finished.
      enable-auto-commit: false
      # A group with no committed offset starts from the beginning: an event this service has never seen must not be
      # skipped just because it was published before the group existed.
      auto-offset-reset: earliest

      # Everything below is the client's default, written down on purpose: the consumer's behavior, and with several
      # instances of the service how the group shares its partitions and notices a dead instance, is then visible here
      # and does not change with a client upgrade. Where a value is not the default, the comment says why.

      # Only committed transactional writes are visible. Nothing in this system produces transactionally today, so
      # it changes nothing now; it is the safe reading if a producer ever does.
      isolation-level: read-committed
      # How many records one poll may return. Each record is its own database transaction, and a failure discards the rest
      # of the poll (it is fetched again), so a small poll bounds that wasted work. The events are tiny. Not the default (500).
      max-poll-records: 100
      fetch-min-size: 1B
      fetch-max-wait: 500ms
      # A consumer whose heartbeats stop for session.timeout.ms is dropped from the group and its partitions go to another
      # instance; the heartbeat thread runs apart from the processing thread, so a long database wait does not trigger it.
      heartbeat-interval: 3s

      properties:
        session.timeout.ms: 45000
        # The longest allowed gap between two polls. The error handler's database pauses (30 s at most) and a slow batch
        # of 100 records must stay far below it, or the instance is dropped from the group in the middle of working.
        max.poll.interval.ms: 300000
        request.timeout.ms: 30000
        default.api.timeout.ms: 60000

        # The classic group protocol: the settings above (session timeout, assignment strategy) only apply to it.
        group.protocol: classic
        # With more than one instance, the cooperative assignor moves only the partitions that must move when an instance
        # joins or leaves, instead of stopping every consumer of the group for each rebalance (as a rolling deploy would).
        # Not the default (range first).
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

        # Topics are created by infra/kafka/kafka-topics.sh and the broker has auto-creation off; a consumer must never
        # create one by subscribing with a misspelled name. Not the default (true).
        allow.auto.create.topics: false

        retry.backoff.ms: 100
        retry.backoff.max.ms: 1000
        reconnect.backoff.ms: 50
        reconnect.backoff.max.ms: 1000
        connections.max.idle.ms: 540000
        metadata.max.age.ms: 300000

    listener:
      # One offset commit per record, right after the listener returned without an exception.
      ack-mode: record
      # One consumer thread; the topics have three partitions, so this can go up to three without any code change.
      concurrency: 1

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak resource-server config. issuer-uri is only the value the token's "iss" claim must equal
          # (Keycloak's KC_HOSTNAME is pinned to the same string); it is compared, never fetched. jwk-set-uri is
          # where the signing keys are fetched, on the first token and then cached; because it is given
          # explicitly, startup makes no call to Keycloak. Inside a container, override only jwk-set-uri
          # (http://keycloak:8080/...); issuer-uri stays as it is.
          issuer-uri: http://localhost:8080/realms/energy-tracker
          jwk-set-uri: http://localhost:8080/realms/energy-tracker/protocol/openid-connect/certs

server:
  port: 8081

# Only "health" is exposed over HTTP, spelled out explicitly rather than relying on Spring Boot's
# own default staying what it is - /env, /beans etc. can leak configuration and must never be
# public. DataSource (Postgres) health is wired in automatically because spring-boot-starter-data-jpa
# and the postgresql driver are already on the classpath - no extra code needed for that part.
management:
  endpoints:
    web:
      exposure:
        include: health

app:
  kafka:
    # The identity of each producer of the service; everything else about them is spring.kafka.producer.* above. The
    # client id names a producer's metrics and shows in the broker's logs and quotas, so two producers must not share one.
    #
    # The producer that publishes the outbox rows (OutboxBatchPublisher).
    relay-producer:
      client-id: user-service-outbox-relay

    # The producer that publishes records the consumer could not apply to their dead-letter topic.
    dead-letter-producer:
      client-id: user-service-dead-letter

  # outbox.relay.*: how often OutboxRelay polls outbox_events for unpublished rows, and how many
  # it takes per tick - a bounded batch so a large backlog (e.g. after downtime) is drained
  # gradually across several ticks instead of one long-running poll.
  outbox:
     relay:
       interval-ms: 2000
       batch-size: 50
       # One deadline for all acks of a batch (the relay holds the advisory lock and a DB connection meanwhile).
       send-timeout-ms: 5000
       max-batches-per-tick: 10
       # What the relay does after a tick that published nothing (Kafka down, a poison row at the head of the
       # queue): it skips ticks for initial-ms, then 2x that after the next failure, and so on up to max-ms,
       # and goes back to every interval-ms as soon as a tick publishes something. Only the relay's own
       # resources are at stake (a DB connection and the advisory lock for up to send-timeout-ms per failed tick,
       # an UPDATE of attempts/last_error, a WARN line) - Kafka already gets its backoff from the producer
       # settings above. A longer wait only delays events that cannot be sent anyway; max-ms bounds the delay
       # after Kafka is back.
       backoff:
         initial-ms: 4000
         max-ms: 30000
     purge:
       retention-days: 7
       batch-size: 1000
       cron: "0 0 3 * * *"

  # processed_events: the consumer's record of events it has already applied. A redelivery cannot be older than the
  # topics' retention (30 days), so older rows are deleted once a day, in batches.
  processed-events:
    purge:
      retention-days: 30
      batch-size: 1000
      cron: "0 30 3 * * *"

  user:
    deletion:
      # How long an account stays DELETION_SCHEDULED (read-only, cancellable) between the user's request and the
      # moment the deletion becomes irreversible. Must be positive or the service refuses to start. 5 minutes keeps
      # development quick; production is 14 to 30 days. The deadline is computed by the database when the user
      # asks, so changing this later moves no deadline that was already set.
      grace: 5m

      # The services that must confirm the cleanup of each deletion that starts from now on: a comma-separated list
      # of lower-case names (they must match the participant's ack handler, checked at start-up once the handlers
      # exist). Copied into user_deletion_participants when the deletion starts, so changing it never alters a
      # deletion already running. Empty while no participant service exists: the saga then completes by time alone.
      required-participants: ""

      # The promoter starts the deletion of accounts whose grace period is over (DELETION_SCHEDULED -> DELETING,
      # personal data scrubbed, UserDeletionStarted written). One batch per tick. It makes no external call, so a
      # short interval is cheap: a few seconds in development, tens of seconds in production.
      promoter:
        interval-ms: 3000
        batch-size: 50

      # The Keycloak delete job: for every account that is DELETING, deletes its Keycloak user (404 = already gone) and
      # records it. No database transaction is open during the call, so a slow Keycloak holds no connection. The batch
      # is small because each account costs one HTTP call (up to the read timeout, twice, when Keycloak is slow); a
      # tick ends early at the first call the open circuit breaker refuses.
      keycloak:
        interval-ms: 3000
        batch-size: 20

      # How long after the Keycloak user is deleted an account waits before it is finalized (DELETING -> DELETED): no
      # new access token can be issued after the delete, and tokens issued before it live five minutes, so after this
      # nothing can still be acting for the user. 1 minute in development, 10 minutes in production. Zero is allowed,
      # a negative value stops the start.
      quiet-period: 1m

      # The finalizer closes every deletion that is ready: Keycloak user gone for the quiet period and every required
      # participant confirmed (UserDeletionFinalized is written). One batch per tick; it makes no external call.
      finalizer:
        interval-ms: 3000
        batch-size: 50

      # The consumer that reads the participants' confirmations (ParticipantAckListener). On by default; a test context
      # that has no Kafka broker turns it off, because a started listener keeps trying to reach one.
      ack-consumer:
        enabled: true

  # Keycloak's admin REST API, called with the service-account client user-service-admin (realm roles manage-users and
  # view-users only). Reachable at base-url from where user-service runs: a container on the compose network would use
  # http://keycloak:8080. The secret comes only from the environment (the same variable fills it into the realm when
  # Keycloak imports it); the application does not start without it.
  keycloak:
    admin:
      base-url: http://localhost:8080
      realm: energy-tracker
      client-id: user-service-admin
      client-secret: ${USER_SERVICE_ADMIN_CLIENT_SECRET}
      # Short on purpose: nothing here is worth waiting for, and the jobs retry on their next tick anyway.
      connect-timeout: 1s
      read-timeout: 3s
      # The access token is renewed this long before it expires, so a call never starts with a token about to die.
      token-refresh-margin: 30s
      # One more attempt after a short pause, for failures that can be transient (a timeout, a dropped connection, a
      # 5xx, a rejected token). Both calls are idempotent, which is what makes this safe.
      retry:
        max-attempts: 2
        wait: 200ms
      # Stops asking a Keycloak that keeps failing: with at least minimum-calls attempts in the last sliding-window-size,
      # and failure-rate-threshold percent of them failed, calls are refused for wait-in-open-state, then half-open-calls
      # probes decide whether to close again. Every attempt counts, retries included. The state is the gauge
      # keycloak.admin.circuit.state.
      circuit-breaker:
        sliding-window-size: 10
        minimum-calls: 5
        failure-rate-threshold: 50
        wait-in-open-state: 30s
        half-open-calls: 2

  security:
    # Required for audience mapper
    required-audience: user-service
