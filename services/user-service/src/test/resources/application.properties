# Defaults for every test context, on top of src/main/resources/application.yaml (a .properties file beats the
# .yaml of the same name for the same key). A test that needs the real thing turns it back on with
# @SpringBootTest(properties = ...).

# The participant-ack listener keeps trying to reach a Kafka broker for as long as it is started. Most full-context
# tests have no broker (only Postgres), so it stays off; the tests that exercise it start a broker and switch it on.
app.user.deletion.ack-consumer.enabled=false

# Like the relay and the promoter, which the full-context tests that must not run them park at a day: a finalizer
# ticking every few seconds would finalize the DELETING rows those tests seed, in a database shared between classes.
# Tests that are about the finalizer set a short interval themselves.
app.user.deletion.finalizer.interval-ms=86400000
