spring.application.name=user-service

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRESQL_DB_NAME}
spring.datasource.username=${POSTGRESQL_DB_USER}
spring.datasource.password=${POSTGRESQL_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate because we are using flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect