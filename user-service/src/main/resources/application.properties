spring.application.name=user-service

server.port=8080

# force English regardless of client Accept-Language / OS locale (validation messages were resolving to Turkish otherwise)
spring.web.locale=en_US
spring.web.locale-resolver=fixed

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}?currentSchema=user_service
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# same physical Postgres instance/database as device-service, but its own schema so each
# service gets its own flyway_schema_history and neither sees the other's migrations
spring.flyway.schemas=user_service

# validate because we are using flyway
spring.jpa.hibernate.ddl-auto=validate

#PostgreSQLDialect does not need to be specified explicitly using 'hibernate.dialect'
# (remove the property setting, and it will be selected by default)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EXTERNAL listener (localhost:9094), same as ingestion-service/usage-service - this JVM runs
# outside Docker's network, so it can't resolve the INTERNAL listener's kafka-broker-controller-1
# hostname.
spring.kafka.bootstrap-servers=localhost:9094

# One topic for every event user-service publishes (users + alert_rules) - see KafkaTopicConfig
# for why this is deliberately not split by aggregate type, and why it's "user-domain-events" not
# "user-events".
app.kafka.topic.user-domain=user-domain-events

# LongSerializer to match OutboxEvent.partitionKey. StringSerializer, not JacksonJsonSerializer,
# for the value - OutboxRelay sends outbox_events.payload verbatim, and it's already a serialized
# JSON string; running it through JacksonJsonSerializer again would wrap it in an extra pair of
# escaped quotes instead of sending the JSON object itself.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Deduplicates (means finding and removing extra copies of identical data)
# a retry the PRODUCER itself issues when a send's ack is lost in transit (the
# broker already wrote it, the client just never heard back and would otherwise resend) - a
# different, narrower problem than the outbox's own at-least-once duplicates (see OutboxRelay),
# which happen a full relay tick apart and this can't and doesn't deduplicate. kafka-clients 4.2.1
# (this project's resolved version) already defaults both of these to true/all since Kafka 3.0 -
# spelled out explicitly anyway rather than relying on an unstated library default for something
# correctness-relevant, same reasoning as pinning auto-offset-reset explicitly in usage-service.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all

# How often OutboxRelay polls outbox_events for unpublished rows, and how many it takes per tick -
# a bounded batch so a large backlog (e.g. after downtime) is drained gradually across several
# ticks instead of one long-running poll.
app.outbox.relay.interval-ms=2000
app.outbox.relay.batch-size=100