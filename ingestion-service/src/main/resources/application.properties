spring.application.name=ingestion-service

server.port=8082

spring.kafka.bootstrap-servers=localhost:9094

app.kafka.topic.energy-usage=energy-usage-events
simulation.interval-ms=5000

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer


# JacksonJsonSerializer, not the older JsonSerializer - JsonSerializer is Spring Kafka's legacy,
# Jackson-2-based serializer (built on com.fasterxml.jackson.databind), and since this project has no
# Jackson 2 databind on its classpath at all after migrating, only has Jackson 3's tools.jackson.databind. Property
# keys underneath it are unchanged (spring.json.type.mapping, spring.json.trusted.packages, etc).
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer


# Maps this producer's own class to a short logical alias, written into the __TypeId__ message
# header instead of the raw class name (com.cagritasoz.ingestion_service.event.EnergyUsageEvent).
# That alias, not either side's package/class name, is the actual cross-service contract:
# usage-service (the consumer) will map the SAME alias "energy-usage-event" to
# its own independently-defined class via a matching spring.kafka.consumer.properties.spring.json.type.mapping
# entry. Neither service needs to know or depend on the other's package structure this way.
# Kafka Schema Registry (Avro/Protobuf/JSON Schema) is worth looking into as a stronger version
# of this same idea later - it'd enforce the contract's compatibility at produce time instead of
# just naming it.
spring.kafka.producer.properties.spring.json.type.mapping=energy-usage-event:com.cagritasoz.ingestion_service.event.EnergyUsageEvent